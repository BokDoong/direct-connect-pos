spring:
  application:
    name: order-system

  datasource:
    url: jdbc:h2:mem:order-system;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop     # 데모용 — 엔티티에서 스키마 생성. 실환경은 마이그레이션 도구로 관리
    defer-datasource-initialization: true # Hibernate 스키마 생성 후 data.sql 실행
    open-in-view: false

  sql:
    init:
      mode: always              # data.sql로 partners 시드 → 기동 대사(Reconciler) 통과 조건

  h2:
    console:
      enabled: true             # http://localhost:8080/h2-console

# 코드가 아닌 유일한 것 — 환경 데이터(base-url)와 시크릿(auth-key).
# capability·정책값은 각 파트너 구현체 코드에 있다 (하이브리드 원칙).
# auth-key는 실환경에서 환경변수/시크릿 스토어로 주입한다 (AS-IS 평문 DB 저장의 교정).
partner-pos:
  endpoints:
    CJ_FOODVILLE:
      base-url: https://pos.cj-foodville.example.com
      auth-key: ${CJ_FOODVILLE_AUTH_KEY:local-demo-cj-key}
    LOTTE_GRS:
      base-url: https://pos.lotte-grs.example.com
      auth-key: ${LOTTE_GRS_AUTH_KEY:local-demo-lotte-key}
    BURGER_KING:
      base-url: https://pos.burger-king.example.com
      auth-key: ${BURGER_KING_AUTH_KEY:local-demo-bk-key}
